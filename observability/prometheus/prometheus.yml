global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels: { platform: cloudops-ai }

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: cloudops-backend
    metrics_path: /metrics
    static_configs: [{ targets: ["backend:8000"] }]
  - job_name: demo-services
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080", "user-service:8080", "payment-service:8080", "notification-service:8080"]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
