# TEMPLATE ONLY — not included in kustomization. Create the real secret out-of-band:
#   kubectl -n cloudops create secret generic cloudops-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... [--from-literal=OPENAI_API_KEY=...]
# In AWS use External Secrets Operator backed by AWS Secrets Manager (see overlays/aws).
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://cloudops:<password>@postgres:5432/cloudops_ai"
  JWT_SECRET: "<48+ random characters>"
