[project]
name = "cloudops-agent"
version = "1.0.0"
description = "Tool-using AIOps investigation agent with pluggable LLM providers"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudops_agent"]
