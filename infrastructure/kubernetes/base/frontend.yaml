apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-frontend
  labels: { app.kubernetes.io/name: cloudops-frontend, app.kubernetes.io/part-of: cloudops-ai }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: cloudops-frontend } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudops-frontend, app.kubernetes.io/part-of: cloudops-ai }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: ghcr.io/OWNER/cloudops-ai-frontend:latest
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: BACKEND_URL, value: "http://cloudops-backend:8000" }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: cache, mountPath: /var/cache/nginx }, { name: tmp, mountPath: /tmp }, { name: conf, mountPath: /etc/nginx/conf.d }]
      volumes: [{ name: cache, emptyDir: {} }, { name: tmp, emptyDir: {} }, { name: conf, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-frontend
spec:
  selector: { app.kubernetes.io/name: cloudops-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudops-frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cloudops-frontend }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
