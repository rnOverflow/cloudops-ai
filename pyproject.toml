[project]
name = "cloudops-ai-workspace"
version = "1.0.0"
description = "CloudOps AI monorepo workspace (backend + ai-agent)"
requires-python = ">=3.11"
dependencies = ["cloudops-backend", "cloudops-agent"]

[tool.uv.workspace]
members = ["backend", "ai-agent"]

[tool.uv.sources]
cloudops-backend = { workspace = true }
cloudops-agent = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "moto[ecs,cloudwatch,logs]>=5.0",
  "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: end-to-end incident recovery scenarios",
  "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
