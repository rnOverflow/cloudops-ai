receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  memory_limiter: { check_interval: 5s, limit_mib: 256 }
exporters:
  debug: { verbosity: basic }
  prometheus: { endpoint: 0.0.0.0:8889, namespace: otel }
connectors:
  spanmetrics: {}
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [spanmetrics, debug] }
    metrics: { receivers: [spanmetrics], processors: [batch], exporters: [prometheus] }
